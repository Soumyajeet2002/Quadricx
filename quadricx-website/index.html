<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quadricx — Under Maintenance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #0a0a0f;
      color: #fff;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(99,57,234,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(99,57,234,0.07) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    .glow {
      position: fixed;
      width: 700px; height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,57,234,0.15) 0%, transparent 65%);
      top: 50%; left: 50%;
      transform: translate(-50%, -55%);
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 100%;
    }

    .logo-wrap {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      margin-bottom: 3rem;
    }

    .logo-icon {
      width: 38px; height: 38px;
      border: 1.5px solid #6339ea;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
    }

    .logo-icon svg { width: 20px; height: 20px; display: block; }

    .logo-text {
      font-size: 21px; font-weight: 600;
      letter-spacing: -0.03em; color: #fff;
    }
    .logo-text span { color: #6339ea; }

    .tag {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(99,57,234,0.12);
      border: 1px solid rgba(99,57,234,0.28);
      color: #a78bfa;
      font-size: 11px; font-weight: 500;
      padding: 5px 16px;
      border-radius: 99px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #6339ea;
      animation: blink 1.5s ease-in-out infinite;
      flex-shrink: 0;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }

    .gears {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      margin-bottom: 2.5rem;
    }

    .gear {
      width: 52px; height: 52px;
      border: 2px solid rgba(99,57,234,0.45);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      animation: spin 7s linear infinite;
      position: relative;
    }
    .gear::before {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border-radius: 50%;
      background: rgba(99,57,234,0.2);
      border: 2px solid rgba(99,57,234,0.45);
    }

    .gear.sm {
      width: 34px; height: 34px;
      animation-direction: reverse;
      animation-duration: 4.5s;
    }
    .gear.sm::before { width: 11px; height: 11px; }

    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-size: 42px; font-weight: 600;
      color: #fff; letter-spacing: -0.04em;
      line-height: 1.15; margin-bottom: 1.25rem;
    }
    h1 em { color: #a78bfa; font-style: normal; }

    .subtitle {
      font-size: 16px;
      color: rgba(255,255,255,0.4);
      line-height: 1.75;
      max-width: 400px;
      margin: 0 auto 2.5rem;
    }

    .divider {
      width: 56px; height: 1px;
      background: rgba(99,57,234,0.35);
      margin: 0 auto 1.75rem;
    }

    .contact {
      font-size: 13px;
      color: rgba(255,255,255,0.28);
    }
    .contact a {
      color: #a78bfa;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .contact a:hover { opacity: 0.75; text-decoration: underline; }

    @media (max-width: 480px) {
      h1 { font-size: 30px; }
      .gear { width: 40px; height: 40px; }
      .gear::before { width: 14px; height: 14px; }
      .gear.sm { width: 28px; height: 28px; }
      .gear.sm::before { width: 9px; height: 9px; }
    }
  </style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="glow"></div>

  <div class="content">

    <div class="logo-wrap">
    </div>

    <div class="tag">
      <span class="dot"></span>
      Maintenance in progress
    </div>

    <div class="gears">
      <div class="gear sm"></div>
      <div class="gear"></div>
      <div class="gear sm"></div>
    </div>

    <h1>We're upgrading<br>the <em>experience</em></h1>

    <p class="subtitle">
      Our team is working behind the scenes to bring you something better.
      We'll be back online very soon.
    </p>

    <div class="divider"></div>

    <p class="contact">
      Need help? Contact us at
      <a href="mailto:support@quadricx.com">connect@quadricx.in</a>
    </p>

  </div>

</body>
</html>
